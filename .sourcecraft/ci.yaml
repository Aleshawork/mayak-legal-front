# CI/CD SourceCraft → Yandex Object Storage
# Docs: https://sourcecraft.dev/portal/docs/ru/sourcecraft/ci-cd-ref/on
#
# Перед первым запуском:
# 1. Бакет Object Storage (website hosting, index.html, public-read)
# 2. Сервисный аккаунт с ролью storage.editor
# 3. Сервисное подключение в SourceCraft с именем из service_connection ниже

on:
  push:
    - workflows: [build-and-deploy]
      filter:
        branches: ["main"]

tokens:
  yc:
    service_connection: mayak-default
    scope: repo

workflows:
  build-and-deploy:
    tasks:
      - name: build
        cubes:
          - name: build-site
            image: node:22
            script:
              - |
                npm ci
                npm run build
            artifacts:
              paths:
                - dist/**

      - name: deploy
        needs:
          - build
        env:
          BUCKET_NAME: mayak-legal-front
        cubes:
          # Диагностический кубик: декодирует JWT (id_token) и выводит claims
          # iss / sub для сверки с правилами федерации сервисных аккаунтов
          # в Yandex Cloud (Identity and Access Management).
          - name: diag-token
            env:
              ID_TOKEN: ${{ tokens.yc.id_token }}
            image: node:22
            script:
              - |
                set -euo pipefail
                if [ -z "$ID_TOKEN" ]; then
                  echo "❌ ID_TOKEN is empty"
                  exit 1
                fi
                # Извлекаем payload JWT (вторая часть, разделённая точками).
                PAYLOAD=$(echo "$ID_TOKEN" | cut -d. -f2)
                # Декодируем base64url -> обычный base64 и парсим JSON.
                PADDING=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
                PADDED="$PAYLOAD$(printf '=%.0s' $(seq 1 $PADDING))"
                echo "=== ID_TOKEN claims ==="
                echo "$PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null | jq . || echo "❌ Could not decode JWT payload"
                echo "========================"

          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.yc.id_token }}
              YC_SA_ID: ${{ tokens.yc.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: upload
            env:
              YC_FOLDER_ID: ${{ tokens.yc.folder_id }}
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                set -euo pipefail
                yc config set folder-id "$YC_FOLDER_ID"
                test -d dist
                echo "Upload dist/ → s3://$BUCKET_NAME/"
                yc storage cp --recursive ./dist/ "s3://$BUCKET_NAME/"
                echo "Done. Check Object Storage website URL for bucket: $BUCKET_NAME"
