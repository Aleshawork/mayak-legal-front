# CI/CD SourceCraft → Yandex Object Storage
# Docs: https://sourcecraft.dev/portal/docs/ru/sourcecraft/ci-cd-ref/on
#
# Перед первым запуском:
# 1. Бакет Object Storage (website hosting, index.html, public-read)
# 2. Сервисный аккаунт с ролью storage.editor
# 3. Сервисное подключение в SourceCraft с именем из service_connection ниже

on:
  push:
    - workflows: [build-and-deploy]
      filter:
        branches: ["main"]

tokens:
  yc:
    service_connection: mayak-default
    # Область запроса доступа.
    # Используется ref, чтобы токен содержал привязку к ветке и совпадал
    # с правилом сопоставления в федерации сервисных аккаунтов Yandex Cloud
    # (sub вида repo:org/repo:ref:refs/heads/main).
    scope: ref

workflows:
  build-and-deploy:
    tasks:
      - name: build
        cubes:
          - name: build-site
            image: node:22
            script:
              - |
                npm ci
                npm run build
            artifacts:
              paths:
                - dist

      - name: deploy
        needs:
          - build
        env:
          BUCKET_NAME: mayak-legal-front
        cubes:
          # Диагностический кубик: декодирует JWT (id_token) и выводит claims
          # iss / sub для сверки с правилами федерации сервисных аккаунтов
          # в Yandex Cloud (Identity and Access Management).
          - name: diag-token
            env:
              ID_TOKEN: ${{ tokens.yc.id_token }}
            image: node:22
            script:
              - |
                set -eu
                if [ -z "$ID_TOKEN" ]; then
                  echo "❌ ID_TOKEN is empty"
                  exit 1
                fi
                # Извлекаем payload JWT (вторая часть, разделённая точками).
                PAYLOAD=$(echo "$ID_TOKEN" | cut -d. -f2)
                # Декодируем base64url -> обычный base64 и парсим JSON через node.
                node -e '
                  const p = process.env.ID_TOKEN.split(".")[1];
                  const b = p.replace(/-/g, "+").replace(/_/g, "/");
                  const pad = b.length % 4 === 0 ? "" : "=".repeat(4 - b.length % 4);
                  const json = Buffer.from(b + pad, "base64").toString("utf8");
                  console.log("=== ID_TOKEN claims ===");
                  console.log(JSON.stringify(JSON.parse(json), null, 2));
                  console.log("========================");
                '

          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.yc.id_token }}
              YC_SA_ID: ${{ tokens.yc.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: upload
            env:
              YC_FOLDER_ID: ${{ tokens.yc.folder_id }}
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                set -euo pipefail
                echo "=== Working directory ==="
                pwd
                echo "=== Files in cwd ==="
                ls -la
                echo "=== Find dist ==="
                find . -maxdepth 3 -name dist -type d
                echo "=== Uploading to Object Storage ==="
                yc config set folder-id "$YC_FOLDER_ID"
                test -d dist
                echo "--- yc storage s3 --help ---"
                yc storage s3 --help
                echo "Upload dist/ → s3://$BUCKET_NAME/"
                yc storage s3 cp --recursive ./dist/ "s3://$BUCKET_NAME/"
                echo "Done. Check Object Storage website URL for bucket: $BUCKET_NAME"